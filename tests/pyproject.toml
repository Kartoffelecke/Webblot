[project]
name = "web-blot-tests"
version = "0"
description = "Browser tests for web_blot"
requires-python = ">=3.12"
dependencies = ["pytest", "pytest-playwright", "numpy", "scipy", "tifffile"]

[tool.pytest.ini_options]
testpaths = ["."]
# Chromium (Chrome, Edge) and WebKit (Safari)
addopts = "--browser chromium --browser webkit"
