# Publish the page on GitHub Pages whenever main changes, once the tests pass.
# Only the page itself (index.html, css/, js/) goes on the website; the tests
# and their data stay in the repository only.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push does not cancel one that is running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the test environment
        working-directory: tests
        run: |
          uv sync
          uv run playwright install --with-deps chromium webkit
      - name: Run the tests (Chromium and WebKit)
        working-directory: tests
        run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the page
        run: |
          mkdir site
          cp -r index.html css js site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
