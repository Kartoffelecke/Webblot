# Publish the page on GitHub Pages whenever main changes, once the tests pass.
# Only the page itself (index.html, css/, js/) goes on the website; the tests
# and their data stay in the repository only. A pull request into main runs the
# tests too, without publishing.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# main: one deployment at a time, and a newer push does not cancel one that is
# running. A pull request: its own group, where a newer push replaces the run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tests that decide about publishing, on the system they are written on.
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the test environment
        working-directory: tests
        run: |
          uv sync
          uv run playwright install chromium webkit
      - name: Run the tests (Chromium and WebKit)
        working-directory: tests
        run: uv run pytest -ra

  # The same on Linux, for information: some tests fail there for reasons not yet
  # understood (see the run's log), so it does not hold up publishing.
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the test environment
        working-directory: tests
        run: |
          uv sync
          uv run playwright install --with-deps chromium webkit
      - name: Run the tests (Chromium and WebKit)
        working-directory: tests
        run: uv run pytest -ra

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the page
        run: |
          mkdir site
          cp -r index.html css js site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
